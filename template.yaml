AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for Puppeteer PDF Generation, Email Sending, and Large Export Processing with Lambda and Step Functions

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 300
    Environment:
      Variables:
        SEMAPHOR_APP_URL: !Ref SemaphorAppUrl
        LAMBDA_API_KEY: !Ref LambdaApiKey

Parameters:
  SemaphorAppUrl:
    Type: String
    Description: Base URL for Semaphor application
    Default: https://semaphor.cloud

  LambdaApiKey:
    Type: String
    Description: API key for Lambda authentication with Semaphor backend
    NoEcho: true

  SesSenderEmail:
    Type: String
    Description: SES verified email address for sending reports (e.g., noreply@yourdomain.com)
    Default: noreply@semaphor.cloud

  EmailProviderMode:
    Type: String
    Description: Email provider mode for report delivery
    Default: SES
    AllowedValues:
      - SES
      - EXTERNAL

  EmailEnableMultiRecipients:
    Type: String
    Description: Send to all resolved recipients when true, otherwise legacy first-recipient behavior
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  SesRegion:
    Type: String
    Description: AWS region for SES client calls
    Default: us-east-1

  EmailExternalAuthSecret:
    Type: String
    Description: Shared secret used for signing EmailSender -> external provider requests
    Default: ''
    NoEcho: true

  ResendApiKey:
    Type: String
    Description: API key for same-stack Resend provider Lambda
    Default: ''
    NoEcho: true

  ResendSenderEmail:
    Type: String
    Description: Sender email used by same-stack Resend provider Lambda
    Default: reports@yourdomain.com

  AutomationDispatchRuleState:
    Type: String
    Description: Enable or disable the Automation V2 dispatcher EventBridge rule
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED

Resources:
  # S3 Bucket Resource
  PdfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'semaphor-reports-${AWS::AccountId}-${AWS::StackName}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldPdfs
            Prefix: pdfs/
            Status: Enabled
            ExpirationInDays: 30
          - Id: DeleteOldEmails
            Prefix: emails/
            Status: Enabled
            ExpirationInDays: 30
          - Id: DeleteExportFiles
            Prefix: exports/
            Status: Enabled
            ExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:Put
            Function: !GetAtt EmailSenderFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: emails/

  # S3 Bucket Policy to Control Access
  PdfBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PdfBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaAccessGeneratePdf
            Effect: Allow
            Principal:
              AWS: !GetAtt GeneratePdfFunctionRole.Arn
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:PutObjectTagging
            Resource:
              - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/pdfs/*'
              - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/emails/*'
          - Sid: AllowLambdaAccessEmailSender
            Effect: Allow
            Principal:
              AWS: !GetAtt EmailSenderFunctionRole.Arn
            Action:
              - s3:GetObject
              - s3:GetObjectTagging
            Resource:
              - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/emails/*'
          - Sid: AllowChunkProcessorAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt ChunkProcessorFunctionRole.Arn
            Action:
              - s3:PutObject
            Resource:
              - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/exports/*'
          - Sid: AllowCompactionProcessorAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt CompactionProcessorFunctionRole.Arn
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/exports/*'

  # IAM Role for GeneratePdfFunction
  GeneratePdfFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:PutObjectTagging
                Resource:
                  - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/pdfs/*'
                  - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/emails/*'

  # Lambda Function for PDF Generation
  GeneratePdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      CodeUri: ./pdf-generation # Directory for PDF generation code
      MemorySize: 4096
      Role: !GetAtt GeneratePdfFunctionRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['GET', 'POST']
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref PdfBucket

  # IAM Role for EmailSenderFunction
  EmailSenderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AndSESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectTagging
                Resource: !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/emails/*'
              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                Resource: '*'

  # Lambda Function for Email Sending
  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      CodeUri: ./email-sender # Directory for email sending code
      MemorySize: 128 # Smaller memory since it's lightweight
      Role: !GetAtt EmailSenderFunctionRole.Arn
      Environment:
        Variables:
          SES_SENDER_EMAIL: !Ref SesSenderEmail
          EMAIL_PROVIDER_MODE: !Ref EmailProviderMode
          EMAIL_ENABLE_MULTI_RECIPIENTS: !Ref EmailEnableMultiRecipients
          SES_REGION: !Ref SesRegion
          EMAIL_EXTERNAL_WEBHOOK_URL: !GetAtt ResendProviderFunctionUrl.FunctionUrl
          EMAIL_EXTERNAL_AUTH_SECRET: !Ref EmailExternalAuthSecret
      Events:
        S3UploadTrigger:
          Type: S3
          Properties:
            Bucket: !Ref PdfBucket
            Events: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: emails/

  ResendProviderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs18.x
      CodeUri: ./resend-provider
      MemorySize: 256
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          RESEND_API_KEY: !Ref ResendApiKey
          RESEND_SENDER_EMAIL: !Ref ResendSenderEmail
          EMAIL_EXTERNAL_AUTH_SECRET: !Ref EmailExternalAuthSecret
      FunctionUrlConfig:
        AuthType: NONE

  # Lambda Function to process schedules
  ScheduleProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs18.x
      Timeout: 120 # 2 minutes timeout
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeAsync
              Resource: !GetAtt GeneratePdfFunction.Arn
        - AWSLambdaBasicExecutionRole # For CloudWatch Logs
      Environment:
        Variables:
          GENERATE_PDF_FUNCTION_NAME: !Ref GeneratePdfFunction
      PackageType: Zip
      CodeUri: ./schedule-processor # Directory containing your Lambda code

  # EventBridge Rule to trigger the Lambda every 15 minutes
  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Trigger schedule processor every 60 minutes
      ScheduleExpression: rate(60 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ScheduleProcessorFunction.Arn
          Id: ScheduleProcessorTarget

  # Permission for EventBridge to invoke Lambda
  ScheduleProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScheduleProcessorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn

  # Lambda Function to dispatch Automation V2 runs
  AutomationDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs18.x
      Timeout: 120
      MemorySize: 256
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref AutomationStateMachine
      Environment:
        Variables:
          AUTOMATION_DISPATCH_ENABLED: 'false'
          AUTOMATION_BATCH_SIZE: '60'
          AUTOMATION_LEASE_MINUTES: '5'
          AUTOMATION_DISPATCH_KINDS: 'REPORT,ALERT,CACHE_REFRESH'
          AUTOMATION_EXECUTOR_MODE: 'http'
          AUTOMATION_STATE_MACHINE_ARN: !Ref AutomationStateMachine
          AUTOMATION_EXECUTOR_PATH: '/api/v1/automations/internal/execute'
      PackageType: Zip
      CodeUri: ./automation-dispatcher

  # Lambda function used by automation Step Functions execution states
  AutomationExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs18.x
      Timeout: 120
      MemorySize: 256
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          AUTOMATION_EXECUTOR_PATH: '/api/v1/automations/internal/execute'
      PackageType: Zip
      CodeUri: ./automation-executor

  # EventBridge Rule to trigger Automation V2 dispatcher every 5 minutes
  AutomationDispatchRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Trigger Automation V2 dispatcher every 5 minutes
      ScheduleExpression: rate(5 minutes)
      State: !Ref AutomationDispatchRuleState
      Targets:
        - Arn: !GetAtt AutomationDispatcherFunction.Arn
          Id: AutomationDispatcherTarget

  # Permission for EventBridge to invoke Automation V2 dispatcher
  AutomationDispatcherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutomationDispatcherFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AutomationDispatchRule.Arn

  # ============================================
  # AUTOMATION V2 - Step Functions State Machine
  # ============================================

  AutomationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'semaphor-automation-executor-${AWS::StackName}'
      DefinitionUri: statemachine/automation.asl.json
      DefinitionSubstitutions:
        AutomationExecutorArn: !GetAtt AutomationExecutorFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref AutomationExecutorFunction

  # ============================================
  # EXPORT SYSTEM - Step Functions State Machine
  # ============================================

  ExportStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'semaphor-export-processor-${AWS::StackName}'
      DefinitionUri: statemachine/export.asl.json
      DefinitionSubstitutions:
        ChunkProcessorArn: !GetAtt ChunkProcessorFunction.Arn
        CompactionProcessorArn: !GetAtt CompactionProcessorFunction.Arn
        MarkFailedArn: !GetAtt MarkFailedFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ChunkProcessorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CompactionProcessorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MarkFailedFunction

  # ============================================
  # EXPORT SYSTEM - IAM Roles
  # ============================================

  # IAM Role for ChunkProcessorFunction
  ChunkProcessorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ExportsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/exports/*'

  # IAM Role for CompactionProcessorFunction
  CompactionProcessorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ExportsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::semaphor-reports-${AWS::AccountId}-${AWS::StackName}/exports/*'

  # ============================================
  # EXPORT SYSTEM - Lambda Functions
  # ============================================

  # Lambda Function for processing individual chunks
  ChunkProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts
    Properties:
      FunctionName: !Sub 'semaphor-chunk-processor-${AWS::StackName}'
      Handler: app.handler
      CodeUri: ./chunk-processor
      MemorySize: 2048
      Timeout: 300
      Role: !GetAtt ChunkProcessorFunctionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref PdfBucket

  # Lambda Function for compacting chunks into final file
  CompactionProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts
    Properties:
      FunctionName: !Sub 'semaphor-compaction-processor-${AWS::StackName}'
      Handler: app.handler
      CodeUri: ./compaction-processor
      MemorySize: 1024
      Timeout: 900
      Role: !GetAtt CompactionProcessorFunctionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref PdfBucket

  # Lambda Function for marking exports as failed
  MarkFailedFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts
    Properties:
      FunctionName: !Sub 'semaphor-export-mark-failed-${AWS::StackName}'
      Handler: app.handler
      CodeUri: ./mark-failed
      MemorySize: 256
      Timeout: 30

Outputs:
  GeneratePdfFunctionUrl:
    Description: 'Lambda Function URL for PDF generation'
    Value: !GetAtt GeneratePdfFunctionUrl.FunctionUrl
    Export:
      Name: GeneratePdfFunctionUrl
  GeneratePdfFunctionArn:
    Description: 'ARN of the Generate PDF Lambda function'
    Value: !GetAtt GeneratePdfFunction.Arn
    Export:
      Name: GeneratePdfFunctionArn
  S3BucketName:
    Description: 'Name of the S3 bucket for storing PDFs'
    Value: !Ref PdfBucket
    Export:
      Name: S3BucketName
  S3BucketArn:
    Description: 'ARN of the S3 bucket'
    Value: !GetAtt PdfBucket.Arn
    Export:
      Name: S3BucketArn
  EmailSenderFunctionArn:
    Description: 'ARN of the Email Sender Lambda function'
    Value: !GetAtt EmailSenderFunction.Arn
    Export:
      Name: EmailSenderFunctionArn

  ResendProviderFunctionUrl:
    Description: 'Function URL for same-stack Resend provider Lambda'
    Value: !GetAtt ResendProviderFunctionUrl.FunctionUrl
    Export:
      Name: ResendProviderFunctionUrl

  ResendProviderFunctionArn:
    Description: 'ARN of the same-stack Resend provider Lambda function'
    Value: !GetAtt ResendProviderFunction.Arn
    Export:
      Name: ResendProviderFunctionArn

  ScheduleProcessorFunctionArn:
    Description: 'ARN of the Schedule Processor Lambda function'
    Value: !GetAtt ScheduleProcessorFunction.Arn
    Export:
      Name: ScheduleProcessorFunctionArn

  AutomationDispatcherFunctionArn:
    Description: 'ARN of the Automation V2 Dispatcher Lambda function'
    Value: !GetAtt AutomationDispatcherFunction.Arn
    Export:
      Name: AutomationDispatcherFunctionArn

  AutomationExecutorFunctionArn:
    Description: 'ARN of the Automation V2 Executor Lambda function'
    Value: !GetAtt AutomationExecutorFunction.Arn
    Export:
      Name: AutomationExecutorFunctionArn

  AutomationStateMachineArn:
    Description: 'ARN of the Automation V2 State Machine'
    Value: !Ref AutomationStateMachine
    Export:
      Name: AutomationStateMachineArn

  # Export System Outputs
  ExportStateMachineArn:
    Description: 'ARN of the Export State Machine'
    Value: !Ref ExportStateMachine
    Export:
      Name: ExportStateMachineArn

  ChunkProcessorFunctionArn:
    Description: 'ARN of the Chunk Processor Lambda function'
    Value: !GetAtt ChunkProcessorFunction.Arn
    Export:
      Name: ChunkProcessorFunctionArn

  CompactionProcessorFunctionArn:
    Description: 'ARN of the Compaction Processor Lambda function'
    Value: !GetAtt CompactionProcessorFunction.Arn
    Export:
      Name: CompactionProcessorFunctionArn

  MarkFailedFunctionArn:
    Description: 'ARN of the Mark Failed Lambda function'
    Value: !GetAtt MarkFailedFunction.Arn
    Export:
      Name: MarkFailedFunctionArn
